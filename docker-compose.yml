services:

  db:
    image: postgres:16-alpine
    container_name: ecosync-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ecosync_db}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: ecosync-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
  
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecosync-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecosync
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  minio:
    image: minio/minio:latest
    container_name: ecosync-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  app:
    ports:
      - "8501:8501"
    environment:
      TZ: Asia/Seoul
    build: .
    container_name: ecosync-app
    env_file:
      - .env
    depends_on:
      - db
      - kafka
      - minio
    volumes:
      - ./src:/app/src
      - ./sql:/app/sql
      - ./logs:/app/logs
    command: tail -f /dev/null
  
  dlq-reprocessor:
    build: .
    container_name: ecosync-dlq-reprocessor
    environment:
      TZ: Asia/Seoul
    env_file:
      - .env
    depends_on:
      - kafka
      - db
    volumes:
      - ./src:/app/src
    command: >
      sh -c "echo '0 * * * * python /app/src/dlq_reprocessor.py >> /app/logs/dlq.log 2>&1' | crontab - && crond -f"

volumes:
  db_data:
  minio_data:

